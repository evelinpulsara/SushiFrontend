# SonarCloud automatic analysis configuration

sonar.sources=src

# Exclude from copy/paste (duplication) detection:
# - i18n dictionaries: es.ts and en.ts intentionally share the same key structure.
# - api-contract.ts: generated by openapi-typescript (npm run contract:generate).
sonar.cpd.exclusions=src/lib/i18n/dictionaries/**,src/domain/api-contract.ts
